name: Node 26 checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26.13.0
      - name: Install backend without registry audit
        run: npm ci --no-audit --no-fund
        working-directory: backend
      - name: Backend tests
        run: npm test -- --no-cache
        working-directory: backend
      - name: Backend dependency gate (moderate and higher)
        run: npm audit --audit-level=moderate
        working-directory: backend
      - name: Install frontend without registry audit
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Frontend compatibility tests
        run: npm test
        working-directory: frontend
      - name: Frontend production build
        run: npm run build
        working-directory: frontend
      - name: Frontend dependency gate (moderate and higher)
        run: npm audit --audit-level=moderate
        working-directory: frontend
